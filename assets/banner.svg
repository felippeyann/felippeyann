<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" font-family="Consolas, 'Courier New', monospace">
  <style>
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .sq { animation: cycle 6s steps(1) infinite; }
    .sq2 { animation-delay: 2s; } .sq3 { animation-delay: 4s; }
    @keyframes cycle { 0% { opacity: 1; } 33% { opacity: .25; } 100% { opacity: 1; } }
  </style>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="rgba(248,247,243,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="240" fill="#0a0a0b"/>
  <rect width="1200" height="240" fill="url(#grid)"/>
  <rect x="48" y="36" width="760" height="176" fill="#000000"/>
  <rect x="40" y="28" width="760" height="176" fill="#131316" stroke="rgba(248,247,243,0.10)"/>
  <text x="76" y="76" fill="#8A8A94" font-size="14" letter-spacing="3"><tspan fill="#2563EB">//</tspan> PORTFOLIO</text>
  <text x="74" y="136" fill="#F8F7F3" font-size="46" font-weight="700" font-family="'Segoe UI', Helvetica, Arial, sans-serif">Felippe <tspan fill="#60A5FA">Yann</tspan></text>
  <text x="76" y="176" fill="#A1A1AA" font-size="17">data science &#183; llm engineering &#183; shipped products<tspan class="cursor" fill="#2563EB">_</tspan></text>
  <g>
    <rect x="928" y="76" width="64" height="64" fill="#000000"/>
    <rect x="920" y="68" width="64" height="64" fill="#2563EB"/>
    <rect x="938" y="86" width="28" height="28" fill="#0a0a0b"/>
  </g>
  <g font-size="13" fill="#8A8A94">
    <rect class="sq" x="1030" y="80" width="10" height="10" fill="#60A5FA"/>
    <text x="1050" y="90">models</text>
    <rect class="sq sq2" x="1030" y="106" width="10" height="10" fill="#4ade80"/>
    <text x="1050" y="116">pipelines</text>
    <rect class="sq sq3" x="1030" y="132" width="10" height="10" fill="#fbbf24"/>
    <text x="1050" y="142">products</text>
  </g>
  <text x="1160" y="212" fill="#8A8A94" font-size="13" text-anchor="end">felippeyann.github.io</text>
</svg>
